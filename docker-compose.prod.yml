# PRODUCTION — Stack Portainer déployée depuis le tag d'une version publiée (refs/tags/vX.Y.Z), sans mise à jour automatique.
# Étend docker-compose.yml (base commune) avec les verrous maximaux : télémétrie figée sur l'URL Clevoa de production,
# conteneur sans privilèges, système de fichiers en lecture seule, journalisation plafonnée, store chiffré (ENCRYPTION_KEY).
# Portainer : compose path = docker-compose.prod.yml. Le hub refuse de démarrer si PUBLIC_URL n'est pas en https.
services:
  mcp-hub:
    extends:
      file: docker-compose.yml
      service: mcp-hub
    container_name: mcp-hub-prod
    environment:
      APP_ENV: production                    # badge « ENV: PRODUCTION », simulateurs non exposés, https obligatoire
      LOG_LEVEL: info
      PUBLIC_URL: ${PUBLIC_URL:?URL https publique de production, ex. https://mcp.exemple.fr}
      CLEVOA_URL: https://clevoa.fr/api/v1/telemetry
      CLEVOA_KEY: ${CLEVOA_KEY:?clé de licence Clevoa requise en production}
    # Durcissement (utilisateur, lecture seule, capacités, journaux plafonnés) : hérité de docker-compose.yml.

  mcp-backup:
    extends:
      file: docker-compose.yml
      service: mcp-backup
    container_name: mcp-backup-prod

  nginx:
    extends:
      file: docker-compose.yml
      service: nginx
    container_name: mcp-proxy-prod

volumes:
  mcp-data:
