# PRÉ-PRODUCTION — Stack Portainer déployée depuis le tag de la version à recetter (la branche `dev` seulement sur la plateforme d'intégration Clevoa).
# Étend docker-compose.yml (base commune) : logs détaillés, et par défaut TOUTES les API sortantes du hub pointent vers le
# conteneur bouchon `mcp-stub` (Salesforce, Graph, Dropbox MCP, Sage X3, MyReport MCP, Clevoa) avec un jeu de données canin.
# Renseigner une variable (ex. SF_LOGIN_URL, SAGE_URL) dans Portainer rebranche ce seul système sur le vrai.
# Portainer : compose path = docker-compose.dev.yml, et BROWSER_URL_REWRITE=http://mcp-stub:4000=>http://<hôte-préprod>:4000
# (le navigateur doit joindre les mires du bouchon ; le défaut localhost:4000 ne vaut que sur Docker Desktop).
services:
  mcp-stub:
    build: ./clevoa-mcp-stub
    container_name: mcp-stub
    restart: unless-stopped
    ports:
      - "${STUB_PORT:-4000}:4000"           # les navigateurs doivent joindre les mires du bouchon
    environment:
      TOKEN_TTL_MIN: ${STUB_TOKEN_TTL_MIN:-10} # durée des jetons d'accès simulés : exerce le refresh automatique du hub
    user: "node"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mcp-hub:
    depends_on:
      - mcp-stub
    extends:
      file: docker-compose.yml
      service: mcp-hub
    container_name: mcp-hub-preprod
    environment:
      APP_ENV: preprod
      LOG_LEVEL: debug                       # trace chaque appel d'outil (nom, durée, succès) ; jamais les arguments ni les résultats
      PUBLIC_URL: ${PUBLIC_URL:?ex. https://mcp-preprod.exemple.fr ou http://localhost:8080}
      # --- Bouchon par défaut (http://mcp-stub:4000 vu du hub, http://localhost:4000 vu du navigateur) ---
      BROWSER_URL_REWRITE: ${BROWSER_URL_REWRITE:-http://mcp-stub:4000=>http://localhost:4000}
      SSO_MODE: ${SSO_MODE:-}                # mock = SSO Entra simulé par le bouchon (Marie, Paul) ; vide par défaut pour ne pas invalider les clés existantes de la pré-prod
      SF_LOGIN_URL: ${SF_LOGIN_URL:-http://mcp-stub:4000}
      SF_MCP_URL: ${SF_MCP_URL:-http://mcp-stub:4000/platform/mcp/v1/d/charlois/platform/sobject-reads}
      SF_CLIENT_ID: ${SF_CLIENT_ID:-stub}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-stub}
      MS_LOGIN_URL: ${MS_LOGIN_URL:-http://mcp-stub:4000/ms}
      GRAPH_URL: ${GRAPH_URL:-http://mcp-stub:4000/v1.0}
      MS_TENANT_ID: ${MS_TENANT_ID:-charlois-stub}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-stub}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-stub}
      SP_SITE: ${SP_SITE:-charlois.sharepoint.com,site-finance}
      DROPBOX_AUTH_URL: ${DROPBOX_AUTH_URL:-http://mcp-stub:4000}
      DROPBOX_API_URL: ${DROPBOX_API_URL:-http://mcp-stub:4000}
      DROPBOX_MCP_URL: ${DROPBOX_MCP_URL:-http://mcp-stub:4000/dropbox-mcp}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-stub}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-stub}
      SAGE_URL: ${SAGE_URL:-http://mcp-stub:4000}
      SAGE_FOLDER: ${SAGE_FOLDER:-PROD}
      SAGE_REPRESENTATIONS: ${SAGE_REPRESENTATIONS:-YFAC,ZVENTE,BPCUSTOMER,PINVOICE,GACCENTRY}
      SAGE_APIKEY_MODE: ${SAGE_APIKEY_MODE:-basic}
      # OAuth de Sage : IdP du bouchon seulement si ces variables sont ABSENTES de .env (« - » et non « :- ») ; présentes et vides
      # = pas d'OAuth, le portail propose l'identifiant et le mot de passe Syracuse (mode vérifié avec un vrai SAGE_URL).
      SAGE_OAUTH_AUTH_URL: ${SAGE_OAUTH_AUTH_URL-http://mcp-stub:4000/oauth/authorize}
      SAGE_OAUTH_TOKEN_URL: ${SAGE_OAUTH_TOKEN_URL-http://mcp-stub:4000/oauth/token}
      SAGE_OAUTH_USERINFO_URL: ${SAGE_OAUTH_USERINFO_URL-http://mcp-stub:4000/oauth/userinfo}
      SAGE_OAUTH_CLIENT_ID: ${SAGE_OAUTH_CLIENT_ID-stub}
      SAGE_OAUTH_CLIENT_SECRET: ${SAGE_OAUTH_CLIENT_SECRET-stub}
      MYREPORT_MCP_URL: ${MYREPORT_MCP_URL:-http://mcp-stub:4000/myreport/sse}
      MYREPORT_TOOLS: ${MYREPORT_TOOLS:-liste_indicateurs,synthese_couts_par_race,valeur_indicateur}
      CLEVOA_URL: ${CLEVOA_URL:-http://mcp-stub:4000/api/v1/telemetry}
      CLEVOA_KEY: ${CLEVOA_KEY:-cle-charlois-dev}
    # Durcissement (utilisateur, lecture seule, capacités, journaux plafonnés) : hérité de docker-compose.yml.

  mcp-backup:
    extends:
      file: docker-compose.yml
      service: mcp-backup
    container_name: mcp-backup-preprod

  nginx:
    extends:
      file: docker-compose.yml
      service: nginx
    container_name: mcp-proxy-preprod

volumes:
  mcp-data:
