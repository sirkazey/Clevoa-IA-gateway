# ACCÈS EN LIGNE POUR CLAUDE (web, mobile, application de bureau) — complément à ajouter APRÈS la stack de pré-production ou de
# production, jamais seul :
#   docker compose -f docker-compose.dev.yml  -f docker-compose.online.yml up -d     (pré-production)
#   docker compose -f docker-compose.prod.yml -f docker-compose.online.yml up -d     (production ; Portainer : « Additional paths »)
# Aucun port entrant : cloudflared ouvre une connexion SORTANTE vers Cloudflare (443 et 7844 TCP/UDP) ; le nom public
# (ONLINE_URL) est routé, dans le tableau de bord Cloudflare, vers http://mcp-hub:8090, le seul port publié par le tunnel. Ce port
# ne sert que l'OAuth (relayé vers Entra ID) et /mcp. cloudflared pourrait techniquement joindre le portail (8080) : le hub y refuse
# toute requête relayée par Cloudflare (403), contre une route de tunnel mal saisie. Guide : docs/admin/acces-en-ligne.md
services:
  mcp-hub:
    environment:
      ONLINE: "on"
      ONLINE_URL: ${ONLINE_URL:?adresse publique du tunnel, sans chemin, ex. https://mcp.exemple.fr}
      ONLINE_CLIENT_ID: ${ONLINE_CLIENT_ID:?ID d'application de l'inscription Entra « connecteur Claude »}
      ONLINE_CLIENT_SECRET: ${ONLINE_CLIENT_SECRET:?secret de l'inscription Entra « connecteur Claude »}
      ONLINE_REDIRECT_URIS: ${ONLINE_REDIRECT_URIS}   # vide = https://claude.ai/api/mcp/auth_callback (web, bureau, mobile)
      ONLINE_TRUST_PROXY: ${ONLINE_TRUST_PROXY:-1}    # cloudflared devant le port 8090 (indépendant de TRUST_PROXY du portail)
    networks: [default, tunnel]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5   # version figée, mise à jour choisie
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?jeton du tunnel (tableau de bord Cloudflare), jamais commité}
    depends_on:
      mcp-hub: { condition: service_healthy }
    restart: unless-stopped
    networks: [tunnel]                         # ne voit que le hub ; aucun port publié sur la machine
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  tunnel: {}
