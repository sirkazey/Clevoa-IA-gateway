name: CI
# À chaque PR et push sur main/dev : tests du hub, du bouchon et du backend Clevoa, scénario de sauvegarde et restauration sur la stack pré-prod,
# retour arrière vers la version publiée précédente,
# puis analyses statiques Semgrep, CodeQL, Gitleaks, Trivy (dépôt et image construite) ; chaque lundi sur main en plus. Rien ne touche un système réel. Versions figées et vérifiées le 23/10/2026.
on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 5 * * 1"   # chaque lundi sur main : nouvelles vulnérabilités de l'image de base et des dépendances, même sans commit
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests hub (pré-prod et production) et bouchon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm ci --prefix hub
      - run: npm ci --prefix clevoa-mcp-stub
      - run: npm ci --prefix clevoa-console
      - name: npm audit (dépendances de production, niveau haut et critique)
        run: npm audit --omit=dev --audit-level=high --prefix hub && npm audit --omit=dev --audit-level=high --prefix clevoa-mcp-stub && npm audit --omit=dev --audit-level=high --prefix clevoa-console
      - name: Hub, pré-prod
        run: npm test --prefix hub
      - name: Hub, verrous de production
        run: APP_ENV=production npm test --prefix hub
      - name: Bouchon de bout en bout
        run: npm test --prefix clevoa-mcp-stub
      - name: Backend Clevoa (sans AWS)
        run: npm test --prefix clevoa-backend
      - name: Console de suivi (données de démonstration, sans AWS)
        run: npm test --prefix clevoa-console
  docs:
    name: Documentation (liens Markdown, ancres, fichiers cités)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: node ops/check-docs.js
  backup-restore:
    name: Sauvegarde et restauration (scripts d'exploitation, stack pré-prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Démarrer la stack pré-prod (hub + bouchon + sauvegarde automatique)
        run: |
          mkdir -p "$PWD/backups"
          printf 'PUBLIC_URL=http://localhost:8080\nENCRYPTION_KEY=%s\nAPP_ENV=preprod\nBACKUP_DIR=%s/backups\n' "$(openssl rand -hex 32)" "$PWD" > .env
          docker compose -f docker-compose.dev.yml up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
      - name: "Scénarios (ops/test-backup-restore.sh) : sauvegardes successives, corruption, perte, restauration, incohérence, mauvaise clé"
        run: BACKUP_DIR="$PWD/backups" ops/test-backup-restore.sh
      - name: Journaux du conteneur de sauvegarde
        if: always()
        run: docker compose -f docker-compose.dev.yml logs --no-log-prefix mcp-backup; ls -la backups || true
      - name: Arrêt
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v || true
  rollback:
    name: Retour arrière (version courante → version publiée précédente → courante, même volume)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # tags nécessaires : la version précédente est reconstruite depuis son tag
      - name: Scénario ops/test-rollback.sh
        run: ops/test-rollback.sh
  semgrep:
    name: Semgrep community rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep:1.181.1 \
            semgrep scan --config p/javascript --config p/nodejs --config p/security-audit --error --json --output /src/semgrep.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-results
          path: semgrep.json
          if-no-files-found: ignore
  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
  gitleaks:
    name: Gitleaks history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config /repo/.gitleaks.toml --redact --exit-code 1 --report-format json --report-path /repo/gitleaks.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks.json
          if-no-files-found: ignore
  trivy:
    name: Trivy dependencies and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-results
          path: trivy.json
          if-no-files-found: ignore
  sbom:
    name: Inventaire des dépendances (SBOM CycloneDX), vulnérabilités et licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # Dépendances de production de chaque paquet livré, depuis le fichier de verrouillage (outil intégré à npm, rien à installer).
      # Le backend Clevoa n'en a aucune (SDK AWS fourni par le runtime Lambda) : voir docs/developer/dependances.md.
      - name: SBOM CycloneDX (hub, bouchon, console)
        run: |
          mkdir -p sbom
          for p in hub clevoa-mcp-stub clevoa-console; do
            (cd "$p" && npm sbom --sbom-format cyclonedx --omit dev --package-lock-only) > "sbom/$p.cdx.json"
          done
      # Vulnérabilités HIGH/CRITICAL corrigées et licences interdites ou restrictives (AGPL, GPL…) : échec.
      - name: Trivy sur le SBOM du hub
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: sbom, scan-ref: sbom/hub.cdx.json, scanners: "vuln,license", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: '1' }
      - name: Trivy sur le SBOM du bouchon
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: sbom, scan-ref: sbom/clevoa-mcp-stub.cdx.json, scanners: "vuln,license", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: '1' }
      - name: Trivy sur le SBOM de la console
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: sbom, scan-ref: sbom/clevoa-console.cdx.json, scanners: "vuln,license", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: '1' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: sbom/
          if-no-files-found: ignore
  trivy-image:
    name: Trivy images construites du hub et de la console (système Alpine, Node, dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire l'image comme en production
        run: docker build -t clevoa-gateway-hub:ci hub
      - name: Scan de l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clevoa-gateway-hub:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-image.json
      - name: Construire l'image de la console
        if: always()
        run: docker build -t clevoa-console:ci -f clevoa-console/Dockerfile .
      - name: Scan de l'image de la console
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clevoa-console:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-image-console.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-image-results
          path: trivy-image*.json
          if-no-files-found: ignore
