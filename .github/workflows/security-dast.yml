name: Security - ZAP baseline (manual)
# Analyse dynamique PASSIVE (zap-baseline : exploration et observation, aucune attaque) contre un hub de démonstration
# démarré sur le runner GitHub, sans aucun système client ni tiers. Déclenchement manuel uniquement.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Start isolated demo hub (simulators only, no real system)
        run: |
          printf 'PUBLIC_URL=http://localhost:8080\nENCRYPTION_KEY=%s\nAPP_ENV=preprod\n' "$(openssl rand -hex 32)" > .env
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
      - name: ZAP baseline passive scan (no active attacks)
        run: |
          mkdir -p zap-report && chmod 777 zap-report   # le conteneur ZAP tourne sous un autre utilisateur : dossier de rapport inscriptible
          docker run --rm --network host -v "${{ github.workspace }}/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://localhost:8080 -m 2 -J zap.json -r zap.html -I
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-baseline-report
          path: |
            zap-report/zap.json
            zap-report/zap.html
          if-no-files-found: ignore
      - name: Stop demo
        if: always()
        run: docker compose down -v || true
