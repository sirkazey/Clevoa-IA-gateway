# serverless.yml — description du déploiement pour le Serverless Framework (npm i -g serverless, puis `serverless deploy`).
# Une API HTTP, deux fonctions Lambda (réception de la télémétrie, passage horaire), une table DynamoDB (état et historique par
# installation, expirés 400 jours après leur écriture), un sujet SNS pour les e-mails d'incident et une politique IAM en
# lecture seule pour la console de suivi (clevoa-console/, sur un poste ou un NAS de Clevoa). Rien d'autre.
service: clevoa-backend          # nom de la pile CloudFormation créée par AWS (clevoa-backend-dev par défaut)
frameworkVersion: "4"            # version majeure du Serverless Framework attendue

provider:
  name: aws                      # cloud cible
  runtime: nodejs22.x            # version de Node exécutée par Lambda ; le SDK AWS v3 (DynamoDB, SNS) est fourni par le runtime
  region: eu-west-3              # Paris ; données hébergées en France
  stage: ${opt:stage, "dev"}     # `serverless deploy --stage prod` pour la production
  memorySize: 128                # suffisant : quelques millisecondes par appel
  timeout: 5                     # secondes avant qu'AWS n'interrompe la fonction
  architecture: arm64            # Graviton : moins cher que x86 à performance égale
  logRetentionInDays: 90         # journaux CloudWatch conservés 90 jours
  environment:
    CLEVOA_KEYS: ${env:CLEVOA_KEYS, ""}         # « client=clé » séparés par des virgules ; entrée sans nom ignorée ; vide = la fonction refuse tout (503)
    TELEMETRY_TABLE: ${self:custom.table}
    RETENTION_DAYS: ${env:RETENTION_DAYS, "400"}  # état et lignes d'historique supprimés (TTL) N jours après leur écriture
    SILENCE_HOURS: ${env:SILENCE_HOURS, "14"}     # incident « silence » au-delà de N heures sans contact (envoi toutes les 6 h : deux créneaux manqués)
    ERROR_RATE: ${env:ERROR_RATE, "0.2"}          # incident d'erreurs : plus de 20 % d'erreurs du système sur une période…
    ERROR_MIN_CALLS: ${env:ERROR_MIN_CALLS, "10"} # …d'au moins 10 appels
    AUTH_MIN_USERS: ${env:AUTH_MIN_USERS, "2"}    # incident d'authentification : tous les collaborateurs refusés, à partir de 2
    SILENCE_MAX_DAYS: ${env:SILENCE_MAX_DAYS, "30"}  # au-delà de N jours, « perdue » : listée dans le rapport, plus d'alerte
    MIN_VERSION: ${env:MIN_VERSION, ""}           # version minimale supportée : le hub en dessous l'écrit dans ses journaux, le rapport la signale
    LATEST_VERSION: ${env:LATEST_VERSION, ""}     # dernière version publiée, renvoyée au hub pour information
    ALERT_TOPIC_ARN: !Ref AlertTopic
  httpApi:
    cors: false                  # appelé par des serveurs (hubs), pas par des navigateurs
  iam:
    role:
      statements:                # droits minimaux : écrire et lire la seule table, publier sur le seul sujet d'alerte
        - Effect: Allow
          Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Scan]
          Resource: !GetAtt InstallationsTable.Arn
        - Effect: Allow
          Action: [sns:Publish]
          Resource: !Ref AlertTopic

custom:
  table: ${self:service}-${sls:stage}-installations

functions:
  telemetry:
    handler: handler.telemetry   # fichier handler.js, export `telemetry`
    description: Réception de la télémétrie des hubs Clevoa AI Gateway (toutes les 6 heures), incidents d'erreurs
    reservedConcurrency: 5       # plafond de coût et de charge (le compte doit disposer de plus de 10 exécutions simultanées) ; au-delà, l'appel échoue et le hub retente
    events:
      - httpApi:                 # API Gateway v2 (HTTP API) : moins cher et plus simple que REST API
          method: POST
          path: /api/v1/telemetry
  report:
    handler: handler.report
    description: Passage horaire, incident « silence » des installations muettes ; rapport JSON à la demande
    events:
      - schedule: cron(7 * * * ? *)   # chaque heure à HH:07 UTC ; consultation à la demande : serverless invoke -f report

resources:
  Resources:
    InstallationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.table}
        BillingMode: PAY_PER_REQUEST        # aucun coût fixe : quelques écritures par jour et par installation
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:                          # pk = client#installation#environnement ; sk = ETAT ou P#<horodatage> (historique)
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true
    AlertTopic:
      Type: AWS::SNS::Topic             # abonnement e-mail à créer une fois (README) : aucune adresse dans ce fichier
      Properties:
        TopicName: ${self:service}-${sls:stage}-alertes
        KmsMasterKeyId: alias/aws/sns     # messages chiffrés au repos (clé gérée par AWS)
    ConsoleReadOnlyPolicy:
      Type: AWS::IAM::ManagedPolicy     # à attacher à l'utilisateur IAM de la console (README) : lecture de la seule table
      Properties:
        ManagedPolicyName: ${self:service}-${sls:stage}-console-lecture
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem, dynamodb:DescribeTable]
              Resource: !GetAtt InstallationsTable.Arn

package:
  patterns:                      # n'embarquer que le code utile dans le zip envoyé à Lambda
    - "!**"
    - handler.js
