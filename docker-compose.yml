# BASE COMMUNE : définitions partagées (lancée seule : démonstration avec les simulateurs internes, sans bouchon). Les stacks docker-compose.dev.yml (pré-prod,
# Docker Desktop) et docker-compose.prod.yml (prod), déployées depuis un tag Git, l'étendent et n'écrivent que leurs différences.
# Le hub est un seul service ; les connecteurs sont des modules. mcp-backup et nginx (profil proxy) sont décrits en bas.
services:
  mcp-hub:
    build: ./hub
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-preprod}            # preprod (défaut) ou production : badge ENV du portail et verrous
      LOG_LEVEL: ${LOG_LEVEL:-info}           # debug = trace des appels d'outils
      TZ: ${TZ:-Europe/Paris}                 # heure de la coupure nocturne du cache, des créneaux de télémétrie et des heures de vérification
      PUBLIC_URL: ${PUBLIC_URL:?URL publique du hub, ex. http://localhost:8080 ou https://mcp.exemple.fr}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?clé maîtresse AES-256 du store (openssl rand -hex 32)}   # chiffre users.json ; la perdre = jetons illisibles
      TRUST_PROXY: ${TRUST_PROXY:-1}          # nombre de reverse-proxys devant le hub (IP réelle pour la limitation de débit)
      # Instance (multi-client) : nom du serveur MCP annoncé aux assistants et clé du bloc mcpServers du portail (défaut clevoa-gateway ;
      # les configurations déjà collées chez les collaborateurs ne dépendent pas de ce nom), et libellé affiché sur le portail (vide = Clevoa AI Gateway).
      MCP_SERVER_NAME: ${MCP_SERVER_NAME}
      INSTANCE_LABEL: ${INSTANCE_LABEL}
      # SSO du portail : vide = pas de SSO (clé créée au premier passage) ; entra = Microsoft Entra ID (OIDC, même application que
      # SharePoint, URI de redirection $PUBLIC_URL/auth/sso/callback, MS_TENANT_ID = GUID de l'annuaire) ; mock = mire du bouchon, interdit en production.
      SSO_MODE: ${SSO_MODE}
      # Salesforce — serveur MCP hébergé "SObject Reads" (Configuration → Serveurs MCP) + External Client App OAuth (scope mcp_api, PKCE),
      # callback = $PUBLIC_URL/auth/salesforce/callback. SF_LOGIN_URL = My Domain de l'org (ou de la sandbox).
      SF_LOGIN_URL: ${SF_LOGIN_URL}
      SF_MCP_URL: ${SF_MCP_URL}
      SF_CLIENT_ID: ${SF_CLIENT_ID}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET}
      SF_SCOPE: ${SF_SCOPE}
      # Sage X3 24R1 — vide = mode simulé (YFAC, YCLIENT, ZVENTE). Callback = $PUBLIC_URL/auth/sagex3/callback
      SAGE_URL: ${SAGE_URL}
      SAGE_FOLDER: ${SAGE_FOLDER}
      SAGE_APIKEY_MODE: ${SAGE_APIKEY_MODE}      # bearer (défaut) ou basic : comment envoyer la clé d'API personnelle
      SAGE_LANG: ${SAGE_LANG}                         # langue des libellés Syracuse ; défaut fr-FR
      SAGE_REPRESENTATIONS: ${SAGE_REPRESENTATIONS}   # représentations exposées ; défaut : 8 standards (BPCUSTOMER, BPSUPPLIER, SINVOICE, PINVOICE, SORDER, PORDER, GACCENTRY, ITMMASTER)
      SAGE_OAUTH_AUTH_URL: ${SAGE_OAUTH_AUTH_URL}
      SAGE_OAUTH_TOKEN_URL: ${SAGE_OAUTH_TOKEN_URL}
      SAGE_OAUTH_USERINFO_URL: ${SAGE_OAUTH_USERINFO_URL}
      SAGE_OAUTH_CLIENT_ID: ${SAGE_OAUTH_CLIENT_ID}
      SAGE_OAUTH_CLIENT_SECRET: ${SAGE_OAUTH_CLIENT_SECRET}
      SAGE_OAUTH_SCOPE: ${SAGE_OAUTH_SCOPE}
      # SharePoint / OneDrive — app Entra ID (permissions déléguées User.Read, Files.Read.All, Sites.Read.All), callback = $PUBLIC_URL/auth/sharepoint/callback
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      SP_SITE: ${SP_SITE}                    # ex. exemple.sharepoint.com:/sites/Finance (vide = OneDrive de l'utilisateur)
      # Dropbox — app Dropbox (scopes lecture), proxy vers le serveur MCP officiel https://mcp.dropbox.com/mcp, callback = $PUBLIC_URL/auth/dropbox/callback
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET}
      # MyReport — proxy MCP distant (HTTP SSE) vers le serveur MCP de votre instance MyReport Server. Vide = simulateur local.
      MYREPORT_MCP_URL: ${MYREPORT_MCP_URL}
      MYREPORT_AUTH_HEADER: ${MYREPORT_AUTH_HEADER}   # défaut Authorization (Bearer <jeton personnel>) ; ex. X-Api-Key
      MYREPORT_TOOLS: ${MYREPORT_TOOLS}               # liste blanche des outils MyReport transférables, ex. liste_indicateurs,valeur_indicateur
      MYREPORT_MAX_PER_MIN: ${MYREPORT_MAX_PER_MIN}   # plafond d'appels sortants vers MyReport (production unique) ; défaut 20, 0 = illimité
      SF_MAX_PER_MIN: ${SF_MAX_PER_MIN}               # plafond d'appels vers le serveur MCP Salesforce (crédits Flex) ; défaut 0 = illimité
      SF_DEFAULT_LIMIT: ${SF_DEFAULT_LIMIT}             # LIMIT ajouté aux SOQL sans borne ; défaut 200, 0 = désactivé
      # Clevoa — télémétrie anonyme quotidienne (version, connecteurs configurés, compteur de requêtes). Vide = désactivée.
      CLEVOA_KEY: ${CLEVOA_KEY}
      CLEVOA_URL: ${CLEVOA_URL}              # défaut https://clevoa.fr/api/v1/telemetry
      # État des systèmes et supervision (1.4.0) — docs/admin/exploitation.md § 11
      PROBE: ${PROBE}                        # vide = vérification de joignabilité (HEAD sans identifiant) toutes les 10 min, lun-ven 7 h-19 h ; off = aucune ; always = à toute heure
      SLOW_MS: ${SLOW_MS}                    # temps de réponse p95 (ms) au-delà duquel le portail affiche « Lent » ; défaut 10000
      METRICS_TOKEN: ${METRICS_TOKEN}        # jeton de la supervision (GET /metrics, format Prometheus) ; vide = route désactivée
      CONNECTOR_DOMAINS: ${CONNECTOR_DOMAINS} # classement sur le portail, ex. sagex3=industrie (commerce, finance, industrie, documents, rh, autre)
    volumes:
      - mcp-data:/data   # users.json : jetons OAuth par utilisateur
    # État « healthy / unhealthy » visible dans Portainer et `docker ps` : le hub répond-il sur /health ? (aucun réseau sortant)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Sauvegarde automatique : copie quotidienne de users.json (chiffré) dans BACKUP_DIR sur la machine hôte (chemin ABSOLU sous Portainer,
  # un dossier par environnement), rétention BACKUP_KEEP_DAYS jours. Restauration : sudo ops/restore.sh <fichier>. Voir docs/admin/exploitation.md.
  mcp-backup:
    image: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53   # même image figée que le hub
    restart: unless-stopped
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - mcp-data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup-loop.sh:/backup-loop.sh:ro
    command: ["sh", "/backup-loop.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE            # seule capacité conservée : lire /data (dossier 700 de l'utilisateur node) et écrire dans BACKUP_DIR quel qu'en soit le propriétaire.
                                # Sans elle, il faudrait soit exécuter la copie sous l'utilisateur node et imposer un BACKUP_DIR appartenant à l'uid 1000
                                # (chown à faire par l'administrateur, fragile sous Portainer), soit relâcher les droits 700 du volume : jugé disproportionné (docs/admin/exploitation.md).

  # Reverse proxy TLS optionnel, inactif sans le profil « proxy » (COMPOSE_PROFILES=proxy). Certificats fullchain.pem et privkey.pem
  # dans CERTS_DIR ; HUB_PORT=127.0.0.1:8080 pour que le hub ne soit joignable que par nginx. Une seule stack par machine peut le porter (80/443).
  nginx:
    image: nginx:1.28-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - mcp-hub
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/mcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true

volumes:
  mcp-data:
